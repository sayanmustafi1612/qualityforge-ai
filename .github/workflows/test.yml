name: QualityForge AI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # nightly full regression

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy core utils api pages --ignore-missing-imports

  api-tests:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/api -m api --alluredir=results/allure -n auto
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: results/allure

  ui-smoke-tests:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest tests/ui tests/integration -m smoke --alluredir=results/allure
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-smoke
          path: results/allure

  full-regression:
    # Only on the nightly schedule, or when a PR is labeled 'run-regression'
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-regression')
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m regression --reruns 2 --alluredir=results/allure -n auto
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: results/allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-history-db
          path: results/history.db
